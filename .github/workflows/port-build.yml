name: Minecraft 26.2 port build
on:
  push:
    branches: ['port/minecraft-26.2']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fpv-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: false
      - name: Inspect target Minecraft APIs
        run: gradle -p modern --no-daemon inspectMinecraftApi
      - name: Compile and test the 26.2 port
        run: gradle -p modern --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: fpvdrone-26.2-development
          path: modern/build/libs/*.jar
          if-no-files-found: error
