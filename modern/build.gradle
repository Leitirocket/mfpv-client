plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation include('org.jmonkeyengine:jme3-core:3.4.0-stable')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('../LICENSE') }

tasks.register('inspectMinecraftApi') {
    doLast {
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get()
        def javap = launcher.metadata.installationPath.file('bin/javap').asFile.absolutePath
        ['net.minecraft.client.Camera', 'net.minecraft.client.player.LocalPlayer',
         'net.minecraft.client.gui.screens.Screen', 'net.minecraft.client.renderer.GameRenderer',
         'net.minecraft.client.gui.components.Button', 'net.minecraft.client.Minecraft',
         'net.minecraft.client.MouseHandler'].each { type ->
            println "API SIGNATURES: $type"
            def process = new ProcessBuilder(javap, '-private', '-classpath', sourceSets.main.compileClasspath.asPath, type)
                .redirectErrorStream(true).start()
            println process.inputStream.getText('UTF-8')
            if (process.waitFor() != 0) throw new GradleException("Cannot inspect $type")
        }
    }
}
